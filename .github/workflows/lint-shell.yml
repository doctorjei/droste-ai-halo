name: lint-shell

# Syntax + static analysis for the repo's hand-written shell.
#
# WHY THIS EXISTS: droste-setup.sh is ~6.7k lines, it is what users pipe into
# bash, and until this workflow landed NO ci job read it at all — a syntax error
# in it would have shipped unnoticed. build-halo.yml only fires on
# base/** + scaffolding/** + targets/**, so the installer, scripts/ and the
# resolver library were entirely outside CI's reach.
#
# THIS WORKFLOW BUILDS NO IMAGES. It only reads files. Its paths filter is
# deliberately tight so it fires on the shell it lints and nothing else, and its
# concurrency group is namespaced `lint-shell-*` so it can never cancel an
# in-flight build-halo run (`build-halo-*`) or a release (`release-*`).
#
# COVERAGE WIDENED TO targets/**, AND THE OVERLAP IS DELIBERATE: the `.sh` under
# targets/** — the per-box profile.d banners and the download/patch helpers —
# were the last hand-written shell in this repo that nothing read. They DO sit
# inside build-halo.yml's trigger, but that workflow BUILDS IMAGES; it never
# parses them AS SHELL. A banner with a syntax error bakes into a layer
# perfectly happily and surfaces later as a broken login prompt inside a box,
# which is both the worst place to find it and the hardest to bisect.
# So a push touching targets/**/*.sh now fires BOTH workflows on purpose — they
# ask different questions of the same file. build-halo.yml is untouched by this
# change, and the namespaced concurrency groups mean neither run can cancel the
# other; only a superseded run of the same workflow on the same ref is cancelled.

on:
  push:
    branches: [main]
    paths:
      - 'droste-setup.sh'
      - 'installer/**'
      - 'scripts/*.sh'
      - 'base/resolve/*.sh'
      - 'targets/**/*.sh'
      - '.github/workflows/lint-shell.yml'
  pull_request:
    paths:
      - 'droste-setup.sh'
      - 'installer/**'
      - 'scripts/*.sh'
      - 'base/resolve/*.sh'
      - 'targets/**/*.sh'
      - '.github/workflows/lint-shell.yml'
  workflow_dispatch:

# Namespaced away from `build-halo-${{ github.ref }}` and
# `release-${{ github.ref_name }}`. A cancel here can only ever cancel a
# superseded lint run on the same ref.
concurrency:
  group: lint-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: bash -n + shellcheck
    runs-on: ubuntu-latest
    # Read-only: this job checks out the tree and runs two linters. It pushes
    # nothing, comments nothing, and touches no package.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The warning baseline below is a fingerprint of ShellCheck's OUTPUT, so
      # it is only meaningful against a fixed ShellCheck. The runner image ships
      # whatever it ships -- 0.9.0 as of this writing, which predates SC2324 --
      # and it is bumped without notice, so relying on it makes the baseline a
      # function of GitHub's release calendar rather than of this repo.
      #
      # This was not theoretical: the first run of this workflow failed exactly
      # here, expecting SC2034=1,SC2324=1 (derived on 0.11.0) and getting
      # SC2034=1 from the runner's 0.9.0. The gate diagnosed itself correctly --
      # its own error text names "the runner's ShellCheck changed" as the second
      # candidate -- and the fix is to pin the analyser, not to loosen the pin.
      #
      # Pinned by version AND sha256: a release asset is mutable in principle,
      # and an analyser that silently changed would move the baseline with it.
      - name: Install pinned ShellCheck
        env:
          SC_VERSION: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o /tmp/shellcheck.tar.xz "$url"
          echo "${SC_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          hash -r

      # 🚨 THE ARTIFACT IS NOT IN THE TREE ANY MORE (phase 3, v0.4.0), SO THIS JOB
      # BUILDS IT. Gates 2 and 3 below both lint droste-setup.sh — it is ~6.7k
      # lines of what users pipe into bash, and it is the whole reason this
      # workflow exists — so untracking it without this step would not "skip"
      # those gates, it would FAIL them on a missing file. Assembling here keeps
      # them linting exactly what a release publishes, since release.yml's
      # installer-asset job runs the same assembler on the same sources.
      # ⚠️ The `installer` job below deliberately does NOT reuse this: it checks
      # the assembler's own properties (silence, determinism, layering) and must
      # run them itself rather than inherit a file this job made.
      - name: Assemble droste-setup.sh (it is a build product now)
        shell: bash
        run: |
          set -euo pipefail
          err=$(scripts/assemble-droste-setup.sh 2>&1 1>droste-setup.sh) || {
            echo "::error::lint-shell: the assembler failed: $err"; exit 1; }
          [ -z "$err" ] || { echo "::error::lint-shell: assembler wrote to stderr: $err"; exit 1; }
          [ -s droste-setup.sh ] || { echo "::error::lint-shell: assembled installer is empty"; exit 1; }
          echo "assembled $(wc -l < droste-setup.sh) lines"

      # Print the version FIRST so that when the pin trips, the log already
      # answers "did the analyser change, or did the code?".
      - name: ShellCheck version
        run: |
          command -v shellcheck
          shellcheck --version

      # ── Gate 1: parse ────────────────────────────────────────────────────
      # Hard failure, no exceptions. Every file below is `bash -n` clean today
      # (all 33, targets/ included — measured before the globs were widened);
      # a red row here is an unshippable script.
      - name: bash -n (hard gate)
        shell: bash
        run: |
          set -euo pipefail
          # globstar so `targets/**/*.sh` reaches EVERY depth. Hand-listing the
          # two depths that exist today (targets/*/profile.d/ and
          # targets/*/scripts/) matches exactly the same files and then silently
          # misses whatever a future box puts a level deeper — which is the
          # precise failure mode this gate exists to prevent, reintroduced in
          # the gate itself.
          shopt -s nullglob globstar
          installer=(droste-setup.sh)
          helpers=(scripts/*.sh)
          resolver=(base/resolve/*.sh)
          boxes=(targets/**/*.sh)
          # A glob that matched nothing would make this gate silently pass on an
          # empty set — decoration, not a check.
          #
          # ⚠️ THE GUARD IS PER GROUP, AND WITH FOUR GROUPS THAT IS NO LONGER A
          # REFINEMENT BUT THE WHOLE POINT. A single floor over the TOTAL cannot
          # see one group go empty, because the other three hold the total above
          # any floor you would pick: drop all of targets/ and a `< 2` check
          # still reports "checked 16 files" and passes, green, having quietly
          # stopped reading a directory. Each group answers for itself, and the
          # error names WHICH glob rotted so the log does the diagnosis.
          for g in helpers resolver boxes; do
            declare -n grp="$g"
            (( ${#grp[@]} )) || {
              echo "::error::lint-shell: glob group '$g' matched no files; the globs are stale."
              exit 1
            }
          done
          # droste-setup.sh is a literal, not a glob, so nullglob cannot drop it
          # and the loop above would not notice its absence — it needs its own
          # existence test to be covered at all.
          [[ -f ${installer[0]} ]] || {
            echo "::error::lint-shell: ${installer[0]} is missing — the assemble step above should have created it. If the assembler moved or was renamed, fix that; this workflow's original reason for existing is linting this artifact."
            exit 1
          }
          files=("${installer[@]}" "${helpers[@]}" "${resolver[@]}" "${boxes[@]}")
          rc=0
          for f in "${files[@]}"; do
            if bash -n "$f"; then
              echo "ok    $f"
            else
              echo "::error file=$f::bash -n failed"
              rc=1
            fi
          done
          echo "checked ${#files[@]} files"
          exit $rc

      # ── Gate 2: shellcheck errors ────────────────────────────────────────
      # Hard failure. Every file is `-S error` clean today (measured, including
      # all 17 under targets/), so this gate is green on arrival AND able to
      # fail — it fires the moment someone writes an actual ShellCheck error
      # anywhere in the linted set.
      #
      # Same four groups and the same per-group staleness guard as gate 1; the
      # reasoning for why the guard is per-group and not a total is written out
      # there and not repeated here.
      - name: shellcheck -S error (hard gate)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          installer=(droste-setup.sh)
          helpers=(scripts/*.sh)
          resolver=(base/resolve/*.sh)
          boxes=(targets/**/*.sh)
          for g in helpers resolver boxes; do
            declare -n grp="$g"
            (( ${#grp[@]} )) || {
              echo "::error::lint-shell: glob group '$g' matched no files; the globs are stale."
              exit 1
            }
          done
          [[ -f ${installer[0]} ]] || {
            echo "::error::lint-shell: ${installer[0]} is missing — the assemble step above should have created it. If the assembler moved or was renamed, fix that; this workflow's original reason for existing is linting this artifact."
            exit 1
          }
          files=("${installer[@]}" "${helpers[@]}" "${resolver[@]}" "${boxes[@]}")
          # ShellCheck reads each file's shebang, so the one `#!/bin/sh` script
          # in the set (targets/ds4/scripts/download_model.sh) is analysed
          # against POSIX sh rather than bash. That is the behaviour we want and
          # it is why no `-s` override is passed here.
          shellcheck -S error -f gcc "${files[@]}"
          echo "no shellcheck errors in ${#files[@]} files"

      # ── Gate 3: the installer's warning baseline ─────────────────────────
      # WHY A PINNED BASELINE AND NOT A PLAIN HARD FAIL:
      # droste-setup.sh has exactly two pre-existing `-S warning` findings, and
      # BOTH are benign, so `-S warning` as a hard gate would be red on arrival —
      # which trains people to ignore the job. Neither can honestly be "fixed":
      #   SC2034 (FUSE_SPEED_NOTE unused)  — a deliberate note carrying a
      #     TODO(Jei-tune) marker; deleting it would delete the note.
      #   SC2324 (var+=1 will append)      — a FALSE POSITIVE. The line is
      #     `fill+=$h`, appending a box-drawing character to build a banner
      #     rule; it is string concatenation and is meant to be.
      # So the baseline is pinned instead. It is a FINGERPRINT (code=count),
      # not a bare total, so that a swap — one warning fixed and a different one
      # introduced — still trips the gate; a bare count of 2 would not notice.
      # It is line-number-independent, so moving code around never trips it.
      #
      # ⚠️ MISMATCH IN EITHER DIRECTION IS A FAILURE, ON PURPOSE. More findings
      # is a regression. FEWER means someone improved the file and the pin is now
      # stale — lower it in the same commit, or the baseline rots into a number
      # nobody believes.
      - name: shellcheck -S warning on droste-setup.sh (pinned baseline)
        shell: bash
        run: |
          set -euo pipefail
          # Fingerprint of the accepted pre-existing findings. Bump deliberately.
          EXPECTED='SC2034=1,SC2324=1'

          out="$(shellcheck -f gcc -S warning droste-setup.sh || true)"
          printf '%s\n' "$out"
          actual="$(printf '%s\n' "$out" \
            | grep -oE '\[SC[0-9]+\]$' | tr -d '[]' \
            | sort | uniq -c | awk '{print $2"="$1}' | paste -sd, - || true)"

          echo "expected baseline: ${EXPECTED}"
          echo "actual   baseline: ${actual}"
          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error file=droste-setup.sh::ShellCheck -S warning baseline moved: expected '${EXPECTED}', got '${actual}'. Either (a) this change introduced/removed a warning — fix it, or update EXPECTED in .github/workflows/lint-shell.yml in the same commit; or (b) the runner's ShellCheck version changed (see the 'ShellCheck version' step above), in which case re-derive the baseline before trusting it."
            exit 1
          fi
          echo "baseline unchanged"

      # ── Gate 4: targets/ is warning-clean, and stays that way ────────────
      # WHY A HARD GATE HERE WHEN THE INSTALLER GETS A PIN AND EVERYTHING ELSE
      # IS REPORT-ONLY: because the measurement came out differently. At the
      # pinned 0.11.0, all 17 `.sh` under targets/** are clean at `-S warning` —
      # ZERO findings, not "a couple of benign ones". Neither existing treatment
      # fits, and it is their REASONS that fail to transfer, not their shape:
      #   • the pinned fingerprint (gate 3) exists because droste-setup.sh
      #     CANNOT be clean — two findings that cannot honestly be fixed. Pinning
      #     targets/ would be a baseline with nothing in it, and a second
      #     per-file pin is precisely the many-baselines maintenance that trains
      #     people to bump a number reflexively instead of reading it.
      #   • report-only (below) exists because scripts/ and base/resolve/ ALREADY
      #     carry warnings, so gating them would land red on arrival.
      # A clean set gets what gate 2 already gives a clean set: a plain hard
      # gate, green on arrival AND able to fail. There is no number to bump and
      # no baseline to rot, because the expected finding count is zero — the
      # cheapest possible thing to maintain and the only one that cannot go
      # stale. Holding a clean set clean costs a line; cleaning a set that has
      # drifted costs what scripts/ and base/resolve/ now owe.
      #
      # ⚠️ IF A WARNING HERE EVER BECOMES LEGITIMATE AND UNFIXABLE, the answer is
      # a `# shellcheck disable=SCxxxx` carrying a reason ON THE LINE, not a new
      # baseline in this file: the exception then documents itself where the next
      # reader is standing, instead of as a number in a workflow they will never
      # open. If that stops being enough, the deliberate retreat is to move these
      # globs down into the report-only step — a one-line change, and a decision
      # someone should have to make on purpose.
      - name: shellcheck -S warning on targets/ (hard gate, expected zero)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          boxes=(targets/**/*.sh)
          (( ${#boxes[@]} )) || {
            echo "::error::lint-shell: glob group 'boxes' (targets/**/*.sh) matched no files; the globs are stale."
            exit 1
          }
          out="$(shellcheck -S warning -f gcc "${boxes[@]}" || true)"
          n="$(printf '%s' "$out" | grep -c . || true)"

          # Report the count in the summary whether it passes or fails. If this
          # step only spoke up on failure, the summary would show findings for
          # scripts/ and base/resolve/ and nothing at all for targets/, and a
          # reader would quite reasonably conclude targets/ is still unlinted.
          {
            echo "### ShellCheck \`-S warning\` — targets/ (hard gate, expected 0)"
            echo
            echo "\`${#boxes[@]}\` file(s) checked, \`${n}\` finding(s)."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$out" ]]; then
            printf '%s\n' "$out"
            echo "::error::lint-shell: targets/ is required to be ShellCheck -S warning clean and is not (${n} finding(s), listed above). Fix the finding; or, if it is a false positive or a deliberate construct, silence it at the line with a '# shellcheck disable=SCxxxx' comment that says why. Do not add a baseline here."
            exit 1
          fi
          echo "no shellcheck warnings in ${#boxes[@]} files under targets/"

      # ── Report-only: warnings in the rest of the shell ───────────────────
      # NOT a gate. scripts/ and base/resolve/ carry pre-existing warnings
      # (droste-init-hook.sh, droste-entrypoint.sh, droste-common.sh and the two
      # adopt shims), so gating them would land red. They are surfaced in the job
      # summary so the count is visible and can be driven down deliberately;
      # promote a file to a pinned baseline once it is worth holding.
      #
      # targets/ is deliberately NOT in this list — it measured clean, so it is
      # hard-gated by gate 4 above rather than merely counted here.
      - name: shellcheck -S warning elsewhere (report only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh base/resolve/*.sh)
          # This step cannot "fail" — but it can silently report an empty table,
          # which is the same lie a passing gate over an empty set tells. It runs
          # `if: always()`, so turning this into an exit would also mask whichever
          # real gate above went red; a log-level warning says so without
          # stealing the failure.
          if (( ${#files[@]} == 0 )); then
            echo "::warning::lint-shell: the report-only globs (scripts/*.sh, base/resolve/*.sh) matched no files; this table is empty because the globs are stale, not because the tree is clean."
          fi
          {
            echo "### ShellCheck \`-S warning\` — report only (does not fail the build)"
            echo
            echo '| file | findings |'
            echo '|---|---|'
            for f in "${files[@]}"; do
              n="$(shellcheck -S warning -f gcc "$f" 2>/dev/null | wc -l || true)"
              [[ "$n" == "0" ]] || echo "| \`$f\` | $n |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          shellcheck -S warning "${files[@]}" || true

  # ── The installer is ASSEMBLED, and this job is what makes that true ────────
  # droste-setup.sh is no longer authored: its sources are installer/*.sh plus
  # installer/py/*.py, and scripts/assemble-droste-setup.sh concatenates them.
  # During phase 2 of the amalgamation BOTH shapes are in the tree, so the
  # assertion here is the strongest one available — the assembled stream is
  # BYTE-IDENTICAL to the tracked file. Either the split is exactly right or it
  # is obviously wrong; there is no partial credit to argue about.
  #
  # A SEPARATE JOB, DELIBERATELY. It needs no ShellCheck, so it does not wait on
  # the pinned-analyser download, and a red here reads as "the artifact does not
  # regenerate" rather than as a lint failure. It shares the workflow's
  # concurrency group, so it still cannot cancel a build-halo run.
  #
  # ⚙️ THE ARTIFACT IS NO LONGER TRACKED (phase 3, v0.4.0), so the byte-identity
  # `cmp` step is gone — there is nothing to compare against. The remaining four
  # checks ARE the whole contract now, which is why the note above them said not
  # to delete them alongside it: they are what the cmp was standing in front of,
  # not duplicates of it. droste-setup.sh is published as a release asset,
  # assembled by release.yml's installer-asset job.
  installer:
    name: droste-setup.sh regenerates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # SILENCE IS THE CONTRACT, so it is checked before anything else: the
      # assembler emits the artifact on stdout and NOTHING anywhere else, which
      # makes "anything on stderr means something went wrong" true by
      # construction rather than by convention. A stray `echo` added later would
      # corrupt the product at a user's terminal; this is the one line that
      # stops it, and it has to run before a step that discards stderr.
      - name: The assembler is silent on success
        shell: bash
        run: |
          set -euo pipefail
          err="$(scripts/assemble-droste-setup.sh 2>&1 >/dev/null)"
          if [[ -n "$err" ]]; then
            printf '%s\n' "$err"
            echo "::error::lint-shell: scripts/assemble-droste-setup.sh wrote to stderr on a successful run. It must be silent on success — no progress, no summary, no diagnostics. See the header of that script."
            exit 1
          fi
          echo "no output on stderr"

      # A `cat` cannot be non-deterministic, which is exactly why this is cheap
      # insurance: it costs a second and it is what would catch a future edit
      # that reached for a timestamp, a hostname or a directory listing order.
      - name: Assembly is deterministic
        shell: bash
        run: |
          set -euo pipefail
          a1="$(mktemp)"; a2="$(mktemp)"
          scripts/assemble-droste-setup.sh > "$a1"
          scripts/assemble-droste-setup.sh > "$a2"
          if ! cmp "$a1" "$a2"; then
            echo "::error::lint-shell: two consecutive assemblies of the same tree differ. Something in scripts/assemble-droste-setup.sh depends on time, environment or directory order."
            exit 1
          fi
          echo "two consecutive assemblies agree"

      # THE POINT OF GIVING THE PYTHON ITS OWN FILES. Inside a heredoc it was a
      # string as far as every tool was concerned: a syntax error shipped and
      # surfaced as a failed image pull on a user's machine. Now it compiles here.
      - name: The embedded Python compiles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          py=(installer/py/*.py)
          # An empty glob would make this step pass having compiled nothing —
          # the silent-green shape this repo has been bitten by more than once.
          (( ${#py[@]} )) || {
            echo "::error::lint-shell: installer/py/*.py matched no files. Either the Python moved or the glob is stale; this step was passing without compiling anything."
            exit 1
          }
          python3 -m py_compile "${py[@]}"
          echo "compiled ${#py[@]} file(s)"

      # THE UI LAYER STAYS BLIND. Its three properties — names no global of
      # ours, calls nothing below it, and never lets the drawing stop to ask a
      # question — were all TRUE BEFORE ANYONE STATED THEM, and all three would
      # die quietly to one reasonable-looking edit. The subject is the ASSEMBLED
      # artifact, not the tracked file, because that is the subject that still
      # exists after phase 3.
      - name: The UI layer names nothing of ours
        shell: bash
        run: |
          set -euo pipefail
          subject="$(mktemp)"
          scripts/assemble-droste-setup.sh > "$subject"
          scripts/check-installer-layering.sh "$subject"
