    note: "SUBSTRING RULE for SAM: architecture is chosen from these tokens in the filename; 'hq' additionally hides a file from Impact's SAMLoader list. Losing the token -> silently built as vit_b -> state-dict crash."
  - filename: "*codeformer*"
    match: glob
    library: ComfyUI-ReActor
    note: "SUBSTRING RULE: the CodeFormer architecture is selected by 'codeformer' in name.lower(); any restorer weight that loses the token is loaded with the wrong arch."
  - filename: "*GFPGAN*"
    match: glob
    library: comfy_mtb
    note: "SUBSTRING RULE: models/face_restore is filtered to names containing GFPGAN or RestoreFormer; a renamed file silently vanishes from the dropdown."
  - filename: "*RestoreFormer*"
    match: glob
    library: comfy_mtb
    note: "SUBSTRING RULE: models/face_restore is filtered to names containing GFPGAN or RestoreFormer; a renamed file silently vanishes from the dropdown."
