# finetuning template manifest (restricted YAML subset: two flat sections,
# `src: dest`, src relative to this dir; format defined by apply_templates.py).
#
# TWO SECTIONS, TWO READERS:
# if_empty  — applied by /opt/resources/resolve/apply_templates.py at box start.
# if_missing — read by the INSTALLER (cfg_manifest → cfg_write_seeds,
#             installer/cfg.sh), which writes each file on the host before the box
#             has ever run. apply_templates.py PARSES this section and does not act
#             on it — the installer is the single writer.
#
# Baked /opt/workspace ships EMPTY (it is the user's bind mountpoint); the pristine
# starter notebooks live here instead and are seeded ONLY into a completely empty
# workspace. A user who deleted/moved the starters expressed intent — any entry at
# all (dotfiles included) skips the seed, so nothing is ever resurrected.
#
if_empty:
  workspace: /opt/workspace

# The box's CONFIG SURFACE, in two halves — the user's own edits, so DATA class
# (/opt/data, never in the installer's wipe) and never overwritten once seeded.
#
# finetuning.cfg carries the environment variables; it is this box's CFG_FILE.
# jupyter_server_config.py carries the ~220 traits, and is only ON JUPYTER'S
# SEARCH PATH because finetuning.cfg sets JUPYTER_CONFIG_DIR to the directory
# below. The two are a pair: seeding the trait file without the env file would
# put it somewhere Jupyter never looks.
if_missing:
  finetuning.cfg: /opt/data/finetuning.cfg
  jupyter_server_config.py: /opt/data/jupyter_server_config.py
