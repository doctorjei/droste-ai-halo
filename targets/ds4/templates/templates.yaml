# templates.yaml — ds4 port seeding manifest (restricted subset, see
# base/resolve/apply_templates.py for the format).
# The `if_missing` section is read by the INSTALLER (cfg_manifest → cfg_write_seeds,
# installer/cfg.sh), which writes the file on the host before the box has ever run —
# written iff it is absent, never overwritten. apply_templates.py PARSES this section
# and does not act on it: the installer is the single writer.
if_missing:
  ds4.cfg: /opt/config/ds4.cfg
