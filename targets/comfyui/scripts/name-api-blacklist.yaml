  # ---------------------------------------------------------------------------
  # Substring hazards (not a specific file - a naming rule)
  # ---------------------------------------------------------------------------
  - filename: "*connector*"
    match: glob
    library: ComfyUI-KJNodes
    note: "SUBSTRING RULE: nodes/model_optimization_nodes.py:325 routes a file to models/text_encoders if 'connector' is in its name, else models/diffusion_models. Adding or removing that token sends the loader to the wrong folder -> get_full_path_or_raise throws."
  - filename: "*vit_h*"
    match: glob
    library: Impact-Pack / comfyui_segment_anything / LayerStyle_Advance
    note: "SUBSTRING RULE for SAM: architecture is chosen from these tokens in the filename; 'hq' additionally hides a file from Impact's SAMLoader list. Losing the token -> silently built as vit_b -> state-dict crash."
  - filename: "*vit_l*"
    match: glob
    library: Impact-Pack / comfyui_segment_anything / LayerStyle_Advance
    note: "SUBSTRING RULE for SAM: architecture is chosen from these tokens in the filename; 'hq' additionally hides a file from Impact's SAMLoader list. Losing the token -> silently built as vit_b -> state-dict crash."
  - filename: "*hq*"
    match: glob
    library: Impact-Pack / comfyui_segment_anything / LayerStyle_Advance
    note: "SUBSTRING RULE for SAM: architecture is chosen from these tokens in the filename; 'hq' additionally hides a file from Impact's SAMLoader list. Losing the token -> silently built as vit_b -> state-dict crash."
  - filename: "*mobile*"
