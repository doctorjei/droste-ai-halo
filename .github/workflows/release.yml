name: Release — version-tag GHCR images

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Tag push: re-tag the already-built per-SHA images on GHCR with
# semantic-version aliases. Assumes build-halo has already built and
# pushed ghcr.io/<owner>/droste-<name>-halo:<sha> for the tagged commit
# (a green build-halo run for that commit is a prerequisite — tag only
# commits whose images exist). Uses `docker buildx imagetools create`,
# which writes new manifest references without downloading or
# re-uploading image layers. For tag v1.2.3, creates these additional
# tags on all 12 images: 1.2.3, 1.2, 1.
#
# Pre-release tags (version string containing a '-', e.g. v0.2.0-rc1)
# create ONLY the full :0.2.0-rc1 tag and leave the moving :X.Y / :X
# aliases pointing at the last stable release.
#
# :latest is NOT touched here — build-halo owns :latest on every
# main-branch build.

permissions:
  contents: read
  packages: write

jobs:
  retag:
    name: Re-tag 12 images for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse semver from tag
        id: v
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          full="${tag#v}"
          [[ "$full" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Malformed release tag: $full"; exit 1; }
          major="${full%%.*}"
          rest="${full#${major}.}"
          minor="${rest%%.*}"
          if [[ "${full}" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi
          echo "full=${full}" >> "$GITHUB_OUTPUT"
          echo "majorminor=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Re-tag all 12 droste-*-halo images
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          SHA="${{ github.sha }}"
          # Everything build-halo.yml pushes: the 3 bases, comfyui, and the
          # 4 ports' -build artifact carriers + runtimes.
          IMAGES=(
            runtime-base build-base torch-base
            comfyui
            ds4-build ds4
            llama-build llama
            vllm-build vllm
            finetuning-build finetuning
          )
          # Pre-flight: verify every source :<sha> image exists BEFORE moving
          # any alias, so a tag on a commit whose images were never built
          # (matrix still running, skipped by the path filter, or failed)
          # aborts the job instead of leaving a half-moved, inconsistent set.
          for name in "${IMAGES[@]}"; do
            src="ghcr.io/${OWNER}/droste-${name}-halo:${SHA}"
            if ! docker buildx imagetools inspect "${src}" >/dev/null 2>&1; then
              echo "::error::Source image missing: ${src} (droste-${name}-halo @ ${SHA}). No aliases moved."
              exit 1
            fi
          done

          if [[ "${{ steps.v.outputs.prerelease }}" == "true" ]]; then
            VERSION_TAGS=(
              "${{ steps.v.outputs.full }}"
            )
          else
            VERSION_TAGS=(
              "${{ steps.v.outputs.full }}"
              "${{ steps.v.outputs.majorminor }}"
              "${{ steps.v.outputs.major }}"
            )
          fi

          for name in "${IMAGES[@]}"; do
            src="ghcr.io/${OWNER}/droste-${name}-halo:${SHA}"
            echo "=== droste-${name}-halo ==="
            for v in "${VERSION_TAGS[@]}"; do
              dst="ghcr.io/${OWNER}/droste-${name}-halo:${v}"
              docker buildx imagetools create --tag "${dst}" "${src}"
            done
          done

  # ── The installer, published as a release asset ──────────────────────────
  # 🚨 WHY THIS EXISTS: droste-setup.sh stops being a tracked file (installer
  # amalgamation phase 3), so the README can no longer point at
  # raw.githubusercontent.com/.../main/droste-setup.sh. The release asset
  # becomes the install path, which is also the honest one — a user then gets a
  # VERSIONED installer rather than whatever main happens to hold.
  #
  # ⚠️ ASSEMBLED HERE, NOT COMMITTED. The artifact is a build product; the
  # sources are installer/*.sh + installer/py/*.py in installer/MANIFEST order.
  # scripts/assemble-droste-setup.sh writes to STDOUT and is silent on success,
  # so a non-empty stderr or a zero-length file is a real failure, not noise.
  #
  # ⚙️ needs: retag — so a release whose images failed to re-tag does not still
  # publish an installer that points at them. The asset is the LAST thing to
  # appear, which makes its presence a signal that the release is complete.
  # ⚙️ contents: write is scoped to THIS JOB rather than the workflow, so the
  # retag job above keeps contents: read. Least privilege per job, not per file.
  installer-asset:
    name: Publish droste-setup.sh for ${{ github.ref_name }}
    needs: retag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the installer
        run: |
          set -euo pipefail
          # ⚠️ ORDER IS LOAD-BEARING: `2>&1` FIRST (stderr joins the command
          # substitution), THEN `1>file` (stdout becomes the artifact). Written the
          # other way round — `> file 2>&1 >/dev/null` — stderr lands IN the artifact
          # and stdout is discarded, which produces an EMPTY installer. Caught by
          # running it rather than reading it.
          err=$(bash scripts/assemble-droste-setup.sh 2>&1 1>droste-setup.sh) || {
            echo "::error::assembler failed: $err"; exit 1; }
          [ -z "$err" ] || { echo "::error::assembler wrote to stderr: $err"; exit 1; }
          [ -s droste-setup.sh ] || { echo "::error::assembled installer is empty"; exit 1; }
          bash -n droste-setup.sh
          echo "assembled $(wc -l < droste-setup.sh) lines"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # 🚨 CREATE-IF-MISSING, BECAUSE A TAG IS NOT A RELEASE. This workflow triggers
          # on a TAG PUSH, and pushing a tag does NOT create a Release object — so a
          # bare `gh release upload` fails with "release not found" and the asset never
          # appears. That is the whole install path for anyone following the README,
          # failing on the one step nobody would think to test.
          # ⚙️ --verify-tag: refuse to invent a release for a tag that does not exist.
          # ⚙️ Pre-releases (a '-' in the version, e.g. v0.4.0-rc1) are marked as such,
          # matching the retag job above, which gives them the exact tag only and leaves
          # the moving :X.Y / :X aliases on the last stable release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $prerelease
          fi
          gh release upload "$TAG" droste-setup.sh --clobber
