# name-api-blacklist.yaml -- files whose NAME IS AN API.
#
# Read by model_scanner.py (`rename` verb only). For most weights a filename is a
# label: nothing in any library cares what it says, so renaming a tree link is purely
# the user's business and the scanner records and defends the choice. For the files
# below the filename is part of a CODE-LEVEL CONTRACT, and renaming one has a
# consequence the user should get to see BEFORE they choose. Three mechanisms, all
# verified by reading the consuming loader:
#
#   A  auto-download-if-missing to a fixed path -- `if not exists(dir/NAME): download()`
#      -> SILENT DUPLICATE DOWNLOAD. The renamed file stays, the canonical name
#         reappears beside it. The most expensive failure and the quietest.
#   B  fixed-path load, no download -- `torch.load(join(dir, "NAME"))`
#      -> HARD ERROR (FileNotFoundError, or the node reporting "model not found").
#   C  filename SNIFF -- architecture or preset chosen from a substring/prefix/tail
#      -> SILENTLY WRONG MODEL, or a file that quietly vanishes from a dropdown.
#         Nastiest of the three: no download, no error, no message.
#
# Mechanism D (a plain picker / directory scan) is SAFE and deliberately absent, as is
# E (files that live in the HF hub cache and are never in the tree at all).
#
# PROVENANCE. Seeded 2026-08-15 (s35) from `danger-models-research.md`, a source-reading
# pass over the ComfyUI custom-node ecosystem: loader functions cloned and read at HEAD,
# 207 rows, every one verified in source except `inswapper_128_fp16.onnx`, which is
# strongly-inferred and says so in its own note. 211 rows here, not 207: four of that
# document's rows each stated SEVERAL patterns in one field (`*vit_h* / *vit_l* / *hq* /
# *mobile*`, `*GFPGAN* / *RestoreFormer*`) and are split one pattern per row, because a
# matcher can act on a pattern and cannot act on a sentence. Nothing was added or
# dropped. The per-ecosystem `loader:` comments below carry the file:line receipts, so
# this table stands on its own evidence even if that document is lost. Nothing here
# rests on a forum post.
#
# THIS FILE IS DATA. Entries are appended without touching a line of Python. The loader
# (model_scanner.load_name_api_blacklist) FAILS OPEN in every direction -- absent file,
# unreadable file, unrecognised row -- because this table exists to WARN, and must never
# be the reason a user cannot rename their own file. It accepts either shape: this
# `files:` mapping, or a bare top-level list, so rows pasted straight out of the
# research document parse whether or not somebody remembered to indent them.
#
# SCHEMA, per row:
#   filename -- the on-disk basename that is load-bearing (matched case-insensitively)
#   match    -- exact (default) | glob | dir
#                 exact: the whole name
#                 glob : an fnmatch pattern, which is how every prefix / tail /
#                        substring rule is spelled -- `taesd_decoder*` (prefix),
#                        `*_sd15.safetensors` (tail), `*vit_h*` (substring). A few of
#                        these (`*hq*`, `*mobile*`) are deliberately broad: over-warning
#                        on a rename is cheap, and --force is one word away.
#                 dir  : the name is a DIRECTORY that a loader addresses as a unit
#                        (insightface packs, `from_pretrained(dir)` model dirs). Its
#                        member files are individually harmless; the DIR name is not.
#                        Matched exactly. The scanner never links or renames a
#                        directory, so these rows are mainly a standing warning to any
#                        future tree-editing feature -- and to whoever reads the table.
#   library  -- who hardcodes it (named verbatim in the skip warning)
#   note     -- ONE line: the mechanism and the consequence, shown to the user when a
#               rename is refused. Write it as the answer to "so what?".
#
# SIBLING FAMILIES are named inside a `note` rather than given a row each -- the twelve
# BiRefNet variants (1038lab/ComfyUI-RMBG), the thirteen LayerDiffuse files
# (ComfyUI-Easy-Use), the `wd-*` tagger family (ComfyUI-WD14-Tagger). That is on
# purpose: their membership lives in the node's own config file (`pysssss.json` and the
# two model lists), and this table does not guess at names nobody has read. Expand them
# from those three files -- or cover a family with one `match: glob` row -- the day
# somebody confirms the shape.
#
# TWO SYSTEMIC FACTS about renaming are NOT in this table because they apply to every
# rename, safe or not, and so belong in the verb rather than the data: saved workflow
# JSON stores the picker STRING, and ComfyUI-Manager decides "already installed" by
# exact filename. model_scanner prints both on every successful rename.

