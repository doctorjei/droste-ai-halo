# templates.yaml — comfyui seed manifest (restricted subset: flat `src: dest` maps;
# src relative to this dir, dest absolute; see base/resolve/apply_templates.py).
#
# TWO SECTIONS, TWO READERS:
# if_empty  — applied by the shared apply_templates.py AFTER mounts, at box start:
#             copy iff dest is a COMPLETELY EMPTY (or missing) directory.
# if_missing — read by the INSTALLER (cfg_manifest → cfg_write_seeds, installer/cfg.sh),
#             which writes each file on the host before the box has ever run: written
#             iff dest does not exist, never overwritten. apply_templates.py PARSES this
#             section and does not act on it — the installer is the single writer.
#
# (mount_shared_models_here is NOT listed here — it is the /opt/models marker BODY,
#  picked up by name by the resolver's OPTIONAL primitive.)

if_empty:
  input: /opt/ComfyUI/input
  user: /opt/ComfyUI/user

# comfyui.cfg is the box's CONFIG SURFACE — the user's own edits, so CONFIG class
# (/opt/config, never in the installer's wipe) and never overwritten once written.
#
# extra_model_paths.yaml is CONFIG class too. It was CACHE class until s73 and DATA
# class until s79. It registers the paths baked into /opt/resources/model_configs,
# which is what made "a re-seeded pointer file, never user work" look right — but the
# file's OWN header tells the user "it is yours: edits persist and are never
# overwritten", so it has the same lifecycle as comfyui.cfg and belongs beside it.
# ⚠️ EXISTING BOXES KEEP THEIR OLD COPY (at /opt/program-cache before s73, at the box's
# data dir before s79) and will be written a fresh default here; the old file is not
# read any more. droste-setup.sh reports an old one it finds rather than writing over
# the top of it — move it by hand (box stopped) if it carries edits.
if_missing:
  comfyui.cfg: /opt/config/comfyui.cfg
  extra_model_paths.yaml: /opt/config/extra_model_paths.yaml
