# vLLM template manifest (restricted YAML subset; format defined by
# apply_templates.py). The `if_missing` section is read by the INSTALLER
# (cfg_manifest → cfg_write_seeds, installer/cfg.sh): it writes the build-generated
# default config to the persisted /opt/config volume before the box has ever run, only
# where the file is absent, and never overwrites the user's edited copy.
# apply_templates.py PARSES this section and does not act on it — the installer is
# the single writer.
#
# TWO files, because vLLM has two kinds of setting: serve flags (YAML keys) and
# runtime environment variables (this box's CFG_FILE). Both are CONFIG class — the
# user's own edits, never in the installer's wipe, never overwritten once seeded.
if_missing:
  vllm_config.yaml: /opt/config/vllm_config.yaml
  vllm.cfg: /opt/config/vllm.cfg
