# distrobox.ini — droste-vllm-halo, distrobox-lane example.
# Create with:   distrobox assemble create --file distrobox.ini
# (remote inis work too: distrobox assemble create --file <URL>)
#
# UNIFIED LANE: init_hooks runs the shared resolver IN the box on every
# container start, giving distrobox the same mount treatment as the server
# lane. In-container it mounts the venv overlay (upper on /opt/program-cache
# — your pip installs survive box recreation; kernel overlay → fuse-overlayfs
# → copy fallback chain, the overlay filesystem rule applies) and binds the
# compute caches (/opt/program-cache/compute/{miopen,miopen-db,triton,vllm}
# over their ~/. paths, so box-specific kernel caches live with the box's
# disposables instead of leaking into the real home). The host home is
# auto-bound, so the shared HF cache (~/.cache/huggingface) — vLLM's model
# store, CRITICAL — persists natively and is deliberately NOT
# resolver-mounted. The hook also verifies that critical, seeds
# /opt/data/vllm_config.yaml (edit it, set `model:`), and writes the
# /opt/models notice. Binds kept in this ini = data + program cache
# (+ optional models) ONLY. Serve with:
#   vllm serve --config /opt/data/vllm_config.yaml
#
# EDIT the host-side (left) paths; create the host dirs first. They MUST be
# absolute: a source that does not start with / or ./ is read as a NAMED
# VOLUME, not a bind (podman), and distrobox 2.x expands nothing. The
# /home/kirobo below is a stand-in for YOUR home.

[droste-vllm]
image=ghcr.io/doctorjei/droste-vllm-halo:latest
init_hooks="/opt/resources/resolve/droste-init-hook.sh"
# In-box mounting needs CAP_SYS_ADMIN (+ /dev/fuse for the fuse-overlayfs
# fallback). `additional_flags` is the documented distrobox-assemble key for
# extra container-manager flags (string_list, space-separated).
additional_flags="--cap-add sys_admin --device /dev/fuse"
# /opt/data = per-box PERSISTENT state, never wiped (the persisted
# vllm_config.yaml). /opt/program-cache = per-box PROGRAM CACHE the installer
# may empty on request (venv upper + the per-box compute caches).
# Shared compute caches across ALL droste boxes are appended below (optional — remove to keep caches per-box).
volume="/home/kirobo/droste/data/vllm:/opt/data /home/kirobo/droste/caches/vllm:/opt/program-cache /home/kirobo/droste/compute-caches:/opt/caches"
# Optional read-only local model collection (config `model:` may point here): to enable, APPEND
#   /home/kirobo/models:/opt/models:ro
# (space-separated) INSIDE the single volume= value above — do NOT add a second volume= line
# (distrobox reads only the LAST volume= key, so a second line silently drops the others).
