# distrobox.ini — droste-comfyui-halo, distrobox-lane example.
# Create with:   distrobox assemble create --file distrobox.ini
# (remote inis work too: distrobox assemble create --file <URL>)
#
# UNIFIED LANE: init_hooks runs the shared resolver IN the box on every
# container start, giving distrobox the same mount treatment as the server
# lane. In-container it mounts the venv + custom_nodes overlays (both uppers on
# /opt/program — pip and custom-node installs both survive box recreation),
# surfaces model-tree and datasets/ from /opt/program over
# /opt/ComfyUI/{models,datasets} plus a scratch temp/ from /opt/program-cache,
# and binds the compute caches
# (/opt/program-cache/compute/* over ~/.cache/* etc.). The overlay filesystem
# rule + fallback chain (kernel overlay → fuse-overlayfs → copy) applies
# exactly as in the server lane. The host home is auto-bound, so the shared
# HF cache (~/.cache/huggingface) persists natively and is deliberately NOT
# resolver-mounted. The hook also verifies the CRITICAL binds below, seeds the
# demo inputs and UI workflows, writes the /opt/models notice, and refreshes the
# model symlink tree on /opt/program.
# Binds kept in this ini = config + program + program cache + user/input/output
# (+ optional models) ONLY — everything else is mounted in-container by the hook.
#
# EDIT the host-side (left) paths; create the host dirs first. They MUST be
# absolute: a source that does not start with / or ./ is read as a NAMED
# VOLUME, not a bind (podman), and distrobox 2.x expands nothing. The
# /home/kirobo below is a stand-in for YOUR home.

[droste-comfyui]
image=ghcr.io/doctorjei/droste-comfyui-halo:latest
init_hooks="/opt/resources/resolve/droste-init-hook.sh"
# In-box mounting needs CAP_SYS_ADMIN (+ /dev/fuse for the fuse-overlayfs
# fallback). `additional_flags` is the documented distrobox-assemble key for
# extra container-manager flags (string_list, space-separated — same value as
# `distrobox create --additional-flags`).
additional_flags="--cap-add sys_admin --device /dev/fuse"
# /opt/config = the box's CONFIG SURFACE and nothing else (comfyui.cfg,
# extra_model_paths.yaml) — never wiped, never overwritten, and nothing gets it
# back; /opt/program = per-box PROGRAM DATA the installer never empties (the venv
# and custom-node uppers, model tree/registry, datasets/, logs/);
# /opt/program-cache = per-box PROGRAM CACHE the installer may empty on request
# (temp/, scratch); user/input/output = CRITICAL work dirs (the
# resolver refuses to proceed unless bound — ALLOW_EPHEMERAL=1 escapes) and live
# beside config/ and program/ under the box's own directory by default.
# Shared compute caches across ALL droste boxes are appended below (optional — remove to keep caches per-box).
volume="/home/kirobo/.local/share/droste/comfyui/config:/opt/config /home/kirobo/.local/share/droste/comfyui/program:/opt/program /home/kirobo/.cache/droste/program/comfyui:/opt/program-cache /home/kirobo/.local/share/droste/comfyui/user:/opt/ComfyUI/user /home/kirobo/.local/share/droste/comfyui/output:/opt/ComfyUI/output /home/kirobo/.local/share/droste/comfyui/input:/opt/ComfyUI/input /home/kirobo/.cache/droste/compute:/opt/caches"
# Optional read-only local model collection (scanner source #2): to enable, APPEND
#   /home/kirobo/models:/opt/models:ro
# (space-separated) INSIDE the single volume= value above — do NOT add a second volume= line
# (distrobox reads only the LAST volume= key, so a second line silently drops the others).
